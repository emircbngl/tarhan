# Cross-oracle CI — TARHAN against DEVSIM, on a schedule.
#
# The main `ci` workflow does NOT install DEVSIM, and every cross-oracle test
# is gated behind `pytest.importorskip("devsim")`. So on every push those tests
# skip, silently, and the job goes green having compared TARHAN against
# nothing. The internal oracles are strong — the 1D-on-2D reduction especially
# — but they are all TARHAN checking TARHAN. Agreement with an independent TCAD
# code is the only evidence here that is not self-referential, and it was not
# being collected. Raised in review.
#
# Why a schedule and not every push: DEVSIM is a heavy optional dependency and
# these comparisons are slow. Drift against an external code is a slow-moving
# risk; a weekly run catches it long before a release, and `workflow_dispatch`
# is there for the moment someone actually wants it now.
#
# THE IMPORTANT PART is the `import devsim` step. A scheduled oracle job that
# skips its own tests reports green and proves nothing — strictly worse than
# having no job at all, because it manufactures confidence. That step turns
# "DEVSIM is missing" into a RED run instead of a quiet skip, and the skip
# check after the run catches every other reason a comparison might vanish.
#
# Actions are pinned to commit SHAs for the same reason as in ci.yml: a tag is
# mutable. Update the sha and the trailing version comment together.
name: oracle

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays, 04:17 UTC — off the hour on purpose
  workflow_dispatch:

jobs:
  cross-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install with the oracle extra
        run: python -m pip install -e ".[dev,oracle]"

      - name: DEVSIM must actually be importable
        # Without this the whole job is theatre: importorskip would skip every
        # comparison and the run would pass.
        run: python -c "import devsim; print('devsim', devsim.__file__)"

      - name: Cross-oracle comparisons
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -rs \
            validation/layer0/semiconductor/test_oracle_devsim.py \
            validation/layer0/semiconductor/test_2d1_pn2d_equilibrium.py \
            validation/layer0/semiconductor/test_2d2_pn2d_iv.py \
            validation/layer0/semiconductor/test_2d3_capacitance.py \
            validation/layer0/numerics/test_tetrahedral_geometry.py \
            | tee result.txt

      - name: No comparison may have been skipped
        # A tolerance that stops being met is a finding someone will read. A
        # test that stops RUNNING is invisible, and this job exists precisely
        # to run these.
        shell: bash
        run: |
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::a cross-oracle comparison was skipped; this job only means something when all of them run"
            grep -E 'SKIPPED|skipped' result.txt
            exit 1
          fi
          echo "every cross-oracle comparison ran"
