# TARHAN CI — kuruluş ilkeleri: regression suite her push'ta headless koşar (#5),
# gerçek kurulum yolu test edilir ("pip install -> çalışır", #paketleme planı),
# demo smoke'u pencereye ihtiyaç duymadan gerçek PNG üretir (sessiz degrade yok, #6).
#
# Actions are pinned to COMMIT SHAs, not tags. A tag is mutable: whoever can
# push to the action's repository can move v4 to different code, and this
# workflow runs with a token that can read the repo. The trailing comment is
# the human-readable version — update BOTH when bumping, and resolve the new
# sha with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (dereferencing an
# annotated tag through `git/tags/<sha>`) rather than copying it from a README.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (real install path)
        run: python -m pip install -e ".[dev,mcp]"
      - name: Layer-0 validation catalog
        run: pytest
      - name: Zero-config demo smoke (headless, real PNG)
        env:
          MPLBACKEND: Agg
        run: tarhan demo --no-show --save demo.png
      - name: Diode demo smoke (flagship solver, self-verifying)
        env:
          MPLBACKEND: Agg
        run: tarhan demo --case diode --no-show --save diode.png

  package:
    # Gerçek dağıtım artefaktı kanıtı: wheel kur → demo koş → uvx yolu (Form Decision)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Build wheel + sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install from wheel (fresh env) + demos
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv /tmp/wheelenv
          WHEEL=$(ls dist/*.whl)
          /tmp/wheelenv/bin/pip install "$WHEEL"
          /tmp/wheelenv/bin/tarhan demo --no-show --save /tmp/demo.png
          /tmp/wheelenv/bin/tarhan demo --case diode --no-show --save /tmp/diode.png
          /tmp/wheelenv/bin/pip install "tarhan[mcp] @ file://$PWD/$WHEEL"
          /tmp/wheelenv/bin/python -c "from tarhan.mcp_server import build_server; build_server(); print('mcp ok')"
      - name: uvx path
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install uv
          WHEEL=$(ls dist/*.whl)
          uvx --from "$WHEEL" tarhan demo --no-show --save /tmp/uvx.png
