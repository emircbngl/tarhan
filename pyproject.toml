[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarhan"
# Kept in sync BY HAND with ``src/tarhan/__init__.py``.  The CLI, ``tarhan
# --version`` and the MCP ``about`` manifest all read the module attribute, not
# this table, so changing one and not the other ships a package that disagrees
# with itself about what it is.  Stays on 0.y.z while the project calls itself
# pre-alpha: under SemVer that is the version range where the API may still
# break, which is the truthful claim here — see CHANGELOG.md.
version = "0.2.0"
description = "Physics-first materials simulator: galvanic cells, fuel cells and semiconductor devices on one charged-species transport kernel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Muhammet Emir Çobanoğlu" }] # CITATION.cff ile SENKRON kalmalı
keywords = ["simulation", "electrochemistry", "fuel-cell", "semiconductor", "drift-diffusion", "nernst-planck"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# Karar (Form Decision 2026-07-03): çıplak kurulum = headless çekirdek + matplotlib;
# 'tarhan demo' sıfır-config çalışır. Qt kabuğu ileride [gui] extra'sı olacak.
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
oracle = ["devsim>=2.9"]   # çapraz-oracle testleri (opsiyonel)
# AI-ajan köprüsü (tarhan-mcp). ÜST SINIR BİLİNÇLİ: mcp 2.0.0 (2026-07-28)
# paketi yeniden yapılandırdı ve `mcp.server.fastmcp` yolunu kaldırdı; ilk CI
# koşusu bunu yakaladı (7/7 iş kırmızı). TARHAN 1.x'e karşı doğrulandı, 2.x'e
# karşı DOĞRULANMADI — sınır ancak 2.x yolu test edilip geçtikten sonra açılmalı.
mcp = ["mcp>=1.1,<2"]
# gelecek (v0.2+ kapısında): gui = ["pyside6>=6.6"], mlx = [...], fast = [...]

[project.scripts]
tarhan = "tarhan.cli:main"
tarhan-mcp = "tarhan.mcp_server:main"

[project.urls]
Repository = "https://github.com/emircbngl/tarhan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["validation/layer0"]
addopts = "-q"
